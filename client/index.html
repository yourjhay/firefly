<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Maze Race</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="sessionModal" class="session-modal" aria-modal="true" role="dialog">
      <div class="session-card">
        <h1 class="session-title">Fireflies.io</h1>
        <p class="session-sub">Host a private room and share the code, or join a friend.</p>
        <button type="button" id="hostBtn" class="session-primary">Host game</button>
        <div class="session-join">
          <label class="session-label" for="joinCode">Join code</label>
          <input
            id="joinCode"
            type="text"
            inputmode="text"
            maxlength="6"
            placeholder="FL1234"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" id="joinBtn" class="session-primary">Join game</button>
        </div>
        <p id="sessionError" class="session-error hidden" role="alert"></p>
      </div>
    </div>

    <header id="hud">
      <div class="hud-left">
        <span id="status" class="pill">Lobby</span>
        <button
          type="button"
          id="roomPill"
          class="pill muted pill-btn hidden"
          title="Copy invite link"
          aria-label="Copy invite link"
        >
          Room —
        </button>
        <span id="roundLabel" class="pill muted">Round —</span>
      </div>
      <div class="hud-right">
        <span id="firePill" class="pill muted">● Ready</span>
        <span id="playerInfo" class="pill">You: —</span>
        <span id="spectatorPill" class="pill muted hidden">Spectating</span>
        <span id="playerCount" class="pill muted">Players: 0</span>
        <button id="serverBtn" class="pill pill-btn" title="Change server URL">
          Server…
        </button>
      </div>
    </header>

    <main id="stage">
      <div class="stage-main">
        <div id="game"></div>
        <div id="banner" class="hidden"></div>
      </div>
      <aside id="sidePanel" class="side-panel">
        <div class="side-panel-inner">
          <div id="leaderboard" class="leaderboard">
            <div class="lb-heading">Leaderboard</div>
            <ul id="leaderboardList" class="lb-list"></ul>
          </div>
          <div id="displayOptions" class="display-options hidden">
            <div class="display-heading">Display (this device)</div>
            <label class="display-row">
              <input type="checkbox" id="fxGlowToggle" />
              <span>Glow (players & ghosts)</span>
            </label>
            <label class="display-row">
              <input type="checkbox" id="fxTrailToggle" />
              <span>Movement trail</span>
            </label>
          </div>
          <div id="hostPanel" class="host-panel hidden">
            <div class="host-heading">Host</div>
            <label class="host-row">
              <input type="checkbox" id="ghostToggle" checked />
              <span>Ghosts</span>
            </label>
            <label class="host-row host-rounds">
              <span>Rounds</span>
              <input type="number" id="roundsInput" min="1" max="50" value="5" />
            </label>
            <button type="button" id="startMatchBtn" class="host-action primary">
              Start game
            </button>
            <button type="button" id="resetMatchBtn" class="host-action hidden">
              Reset to lobby
            </button>
          </div>
          <p id="lobbyWait" class="lobby-wait hidden" aria-live="polite">
            Waiting for host to start…
          </p>
        </div>
      </aside>
    </main>

    <div id="touchControls" aria-hidden="true">
      <div class="dpad">
        <button class="btn up" data-dir="up" aria-label="Up">▲</button>
        <div class="dpad-row">
          <button class="btn left" data-dir="left" aria-label="Left">◀</button>
          <button class="btn right" data-dir="right" aria-label="Right">▶</button>
        </div>
        <button class="btn down" data-dir="down" aria-label="Down">▼</button>
      </div>
      <button class="btn fire" data-action="fire" aria-label="Fire">●</button>
    </div>

    <script src="https://unpkg.com/kaboom@3000.1.17/dist/kaboom.js"></script>
    <script src="network.js"></script>
    <script src="synth.js"></script>
    <script src="renderer.js"></script>
    <script src="controls.js"></script>
    <script src="main.js"></script>
  </body>
</html>
